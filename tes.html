<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teks di Atas Gambar</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* styles.css */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

.image-container {
  position: relative;
  display: inline-block;
  width: 300px; /* Sesuaikan dengan ukuran gambar */
}

.image-container img {
  width: 100%;
  height: auto;
  display: block;
}

.text-overlay {
  position: absolute;
  top: 50%; /* Posisi vertikal teks */
  left: 50%; /* Posisi horizontal teks */
  transform: translate(-50%, -50%); /* Agar teks berada tepat di tengah */
  color: white; /* Warna teks */
  background-color: rgba(0, 0, 0, 0.5); /* Latar belakang transparan */
  padding: 10px 20px;
  border-radius: 5px;
  text-align: center;
}

  </style>
</head>
<body>
  <div class="image-container">
    <a href="article.html">

      <h2>
      <img src="artikel/artikel1.2.jpg" alt="Deskripsi gambar">

        <font class="text-overlay">Teks di Atas Gambar</font>
      </h2>
    </a>
  </div>
</body>
</html>
